route:
  group_by:
  - alertname
  group_wait: 5s
  group_interval: 30s
  repeat_interval: 30s
  receiver: local_test

receiver_defaults:
  webhook:
    send_resolved: false
    max_alerts: 1000
    url: 'http://localhost:8080'


receivers:
- name: local_test
  webhook_configs:
    - url: 'http://localhost:8080'
    - url: 'http://localhost:8080'
      send_resolved: true
    - url: 'http://localhost:8080'
      max_alerts: 5
      http_config:
        follow_redirects: false


