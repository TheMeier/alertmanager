name: Stale Check
on:
  workflow_dispatch: {}
  schedule:
    - cron: '16 22 * * *'
permissions:
  issues: write
  pull-requests: write
jobs:
  stale:
    if: github.repository_owner == 'prometheus' || github.repository_owner == 'prometheus-community' # Don't run this workflow on forks.
    runs-on: ubuntu-latest
    steps:
      # Documentation at https://github.com/actions/stale
      - uses: actions/stale@eb5cf3af3ac0a1aa4c9c45633dd1ae542a27a899 # v10.3.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          operations-per-run: 30

          days-before-stale: 60 # default for issues and PRs

          stale-issue-label: stale
          exempt-issue-labels: keepalive
          stale-issue-message: ''
          days-before-issue-close: -1 # Don't close stale issues.

          stale-pr-label: stale
          exempt-pr-labels: keepalive
          stale-pr-message: ''
          days-before-pr-close: 90 # From last update (including adding the stale label), close PRs after 90 days of inactivity.
